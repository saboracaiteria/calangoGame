name: Build Calango APK

on:
  push:
    branches: [ main ]
    paths:
      - 'CalangoRun/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'CalangoRun/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      
      - name: Build com Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
          build-root-directory: CalangoRun
      
      - name: Upload APK Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calango-run-debug
          path: CalangoRun/app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Preparar Tag e Nome da Release
        id: prep
        run: |
          echo "TAG_NAME=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=Calango Run Build #${{ github.run_number }} ($(date +'%d/%m/%Y %H:%M'))" >> $GITHUB_OUTPUT

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.prep.outputs.TAG_NAME }}
          name: ${{ steps.prep.outputs.RELEASE_NAME }}
          draft: false
          prerelease: true
          files: CalangoRun/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
